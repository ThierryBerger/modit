# Workspace for the host-side crates.
#
# `crates/module-button` is deliberately NOT a member. It is firmware, and it needs a
# different toolchain and target than everything else:
#
#   toolchain   esp (Espressif's Xtensa fork)   vs.  stable
#   target      xtensa-esp32-none-elf           vs.  the host triple
#   std         no_std + build-std              vs.  std
#
# Cargo resolves features and picks a single target per workspace, so those two
# worlds cannot share one. `crates/module-button` therefore carries its own
# `[workspace]` table (making it a workspace root of its own), its own
# `Cargo.lock`, its own `rust-toolchain.toml` and its own `.cargo/config.toml`.
#
# Use `just check` to build both halves with one command.

[workspace]
members = ["crates/brain", "crates/shared"]
exclude = ["crates/module-button"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
shared = { path = "crates/shared" }
anyhow = "1.0.98"
log = "0.4"
