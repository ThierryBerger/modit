name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: host crates (shared + brain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        # Includes firmware_uuids_match_shared, which reads the firmware source
        # to check it has not drifted from shared::uuids. That is why the host
        # job is the one that catches UUID drift.
        run: cargo test --workspace

  firmware:
    name: firmware (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      # Do not cancel the coin build because the button build failed, and vice
      # versa: they are separate workspaces with separate lockfiles, so one
      # breaking says nothing about the other.
      fail-fast: false
      matrix:
        crate: [module-button, module-coin]
    defaults:
      run:
        working-directory: crates/${{ matrix.crate }}
    env:
      # The id only has to be *a* value to compile; flashing is what makes it
      # real. Without it the build fails by design.
      MODIT_ID: ci
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32
          ldproxy: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/${{ matrix.crate }}

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        # A real build, not just check: the panic handler resolves at link time.
        run: cargo build --release

  firmware-avr:
    name: firmware (module-coin-uno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/module-coin-uno
    steps:
      - uses: actions/checkout@v4
      - name: AVR linker
        run: sudo apt-get update && sudo apt-get install -y gcc-avr avr-libc
      # rustup reads the crate's rust-toolchain.toml, pinned nightly and rust-src included.
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/module-coin-uno

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --release -- -D warnings
      - name: Build
        run: cargo build --release
